name: Dependency refresh (unlocked)

# #210: CI runs the Python bridge against `python/uv.lock`, which is exactly
# what makes it reproducible — and exactly what hides an upstream `mcp` 1.x
# minor that breaks us. End users do not resolve from our lock: `uvx
# aiui-mcp` on a remote host resolves `mcp>=1.26.0,<2` fresh at spawn time,
# so a breaking release reaches them before it reaches any PR.
#
# This job is the other half of that trade. It throws the resolution away,
# takes the newest versions the ranges allow, and runs the suite. A failure
# here means "the next `uvx` on a remote will break" — before a release
# would have found out — and it fails this run, never someone's PR.
#
# Manually dispatched only (F-08): scheduled workflows are not used in this
# repo — they start runners with no change and no approval. Dispatch it
# before a release, or alongside a batch CI run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlocked:
    name: aiui-mcp against the newest resolvable deps
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Exact, not `latest` (#192), matching ci.yml and the release. This
          # job holds no secret (`contents: read`); the pin keeps it testing
          # with the same uv the release publishes with.
          version: "0.12.17"

      - name: Re-resolve every dependency to its newest allowed version
        working-directory: python
        run: uv lock --upgrade

      # Printed before the tests so the run's log says WHICH upgrade broke
      # things even when the next step fails.
      - name: Show what moved since the committed lock
        working-directory: python
        run: git --no-pager diff -- uv.lock

      - name: Run unit tests
        working-directory: python
        run: uv run --extra dev pytest tests/ -v

      - name: Build wheel + sdist
        working-directory: python
        run: uv build
