# TEMPORARY (#291) — one-time probe of the release build on macrunner.
# Removed before the PR merges. No secrets, nothing signed or published.
name: macrunner probe

on:
  push:
    branches: [ci/macrunner-xcode27]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macrunner
    timeout-minutes: 60
    steps:
      - name: Runner inventory
        run: |
          sw_vers
          sysctl -n hw.ncpu hw.memsize
          for t in rustup cargo node npm gh python3 uv jq git brew; do
            printf '%-8s ' "$t"; command -v "$t" || echo MISSING
          done
          python3 --version
          gh --version 2>/dev/null | head -1 || true
          xcrun --find notarytool; xcrun --find stapler; xcrun --find vtool || true
          ls -d /Applications/Xcode*.app || true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assert Xcode
        run: bash scripts/assert-xcode.sh

      - name: Install rustup (pinned)
        run: bash scripts/install-rustup.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-11
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin
          components: clippy

      - name: Assert the pinned Rust toolchain
        working-directory: companion/src-tauri
        run: bash ../../scripts/assert-rust-toolchain.sh

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.12.17"

      - name: Drift guards
        run: |
          set -euo pipefail
          ./scripts/check-skill-drift.sh
          ./scripts/test-check-updater-feed.sh
          ./scripts/check-release-ordering.sh
          ./scripts/test-check-release-preconditions.sh

      - name: Python tests
        working-directory: python
        run: uv run --locked --extra dev pytest tests/ -q

      - name: Cargo test (release)
        working-directory: companion/src-tauri
        run: cargo test --locked --lib --release --target aarch64-apple-darwin

      - name: Cargo clippy
        working-directory: companion/src-tauri
        run: cargo clippy --locked --release --target aarch64-apple-darwin -- -D warnings

      - name: Build frontend
        working-directory: companion
        run: npm ci && npm run build

      - name: Assert the locked Tauri CLI
        working-directory: companion
        run: bash ../scripts/assert-tauri-cli.sh

      - name: Tauri build (aarch64, unsigned)
        working-directory: companion
        run: |
          set -euo pipefail
          npx tauri build --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          echo "--- linker / deployment-target warnings:"
          grep -i -E "warning: .*(macos|deployment|platform|sdk|ld:)|ld: warning" "$RUNNER_TEMP/tauri-build.log" || echo "(none)"

      - name: Architecture and minimum macOS (new build)
        run: bash scripts/check-macos-binary.sh companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/aiui.app

      - name: Architecture and minimum macOS (v0.11.0 as shipped)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v0110"
          curl -fsSL -o "$RUNNER_TEMP/v0110/app.zip" https://github.com/byte5ai/aiui/releases/download/v0.11.0/aiui-0.11.0-arm64.zip
          ditto -xk "$RUNNER_TEMP/v0110/app.zip" "$RUNNER_TEMP/v0110"
          bash scripts/check-macos-binary.sh "$RUNNER_TEMP/v0110/aiui.app" || true

      - name: Ad-hoc codesign with entitlements
        run: |
          set -euo pipefail
          APP="companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/aiui.app"
          codesign --force --deep --options runtime --sign - \
            --entitlements companion/src-tauri/entitlements.plist "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Keychain + PKCS#12 import (self-signed, throwaway)
        run: |
          set -euo pipefail
          OSSL="$(brew --prefix openssl@3)/bin/openssl"
          D="$RUNNER_TEMP/p12"; mkdir -p "$D"
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=aiui probe" \
            -addext "extendedKeyUsage=codeSigning" -keyout "$D/k.pem" -out "$D/c.pem"
          "$OSSL" pkcs12 -export -inkey "$D/k.pem" -in "$D/c.pem" -out "$D/p.p12" -passout pass:probe
          KEYCHAIN="$RUNNER_TEMP/probe.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$D/p.p12" -P probe -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security find-identity -p codesigning "$KEYCHAIN"
          security delete-keychain "$KEYCHAIN"

      - name: DMG (unsigned)
        run: |
          set -euo pipefail
          DMG="$PWD/probe-arm64.dmg"
          (cd companion && npx appdmg src-tauri/dmg/config.json "$DMG")
          ls -la "$DMG"
          hdiutil imageinfo "$DMG" | head -5
