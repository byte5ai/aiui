# macOS release pipeline for aiui — CI port of scripts/release.sh.
#
# Why CI and not the maintainer's Mac: signing + notarization run
# exclusively in GitHub Actions per the global convention
# (~/.claude/references/macos_signing.md — Developer ID Application
# certificate + App Store Connect API key, no Apple-ID password, no 2FA).
# The keychain/notary steps below are inlined from the reusable template
# `iret77/host-admin skills/devhost-setup/templates/macos-sign.yml`
# instead of called via `workflow_call`, because aiui signs and notarizes
# THREE artifacts in sequence (app → zip, dmg, updater bundle) and the
# DMG must be built from the already-stapled .app — a single
# `artifact-path` invocation in a separate job cannot express that.
#
# Manually triggered (workflow_dispatch) — never on push. macOS runners
# bill at 10× Linux; a release run is a deliberate, single-job spend.
# The version-sync check runs FIRST so a drifted dispatch dies in
# seconds, not after a 20-minute build (CI playbook: cheap before
# expensive).
#
# Required secrets (org- or repo-level on byte5ai/aiui):
#   MACOS_CERTIFICATE_P12_BASE64      Developer ID Application .p12, base64
#   MACOS_CERTIFICATE_PASSWORD        .p12 export password
#   MACOS_NOTARY_KEY_ID               App Store Connect API key ID
#   MACOS_NOTARY_ISSUER_ID            App Store Connect issuer ID
#   MACOS_NOTARY_KEY_P8_BASE64        .p8 API private key, base64
#   TAURI_SIGNING_PRIVATE_KEY         minisign private key (literal content)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (empty string if none)
#   UV_PUBLISH_TOKEN                  PyPI token, project-scoped to aiui-mcp
#
# The Windows installer is attached afterwards by release-windows.yml
# (also workflow_dispatch, against the release this workflow creates).

name: Release (macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.8.3) — must match Cargo.toml / tauri.conf.json / pyproject.toml"
        required: true
        type: string
      prerelease:
        description: "Mark as GitHub pre-release (updater clients skip it; promote later)"
        required: false
        type: boolean
        default: false
      publish-pypi:
        description: "Publish aiui-mcp to PyPI (PyPI versions are permanent — disable for validate-first runs)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write # tag push + release creation
  actions: write # dispatch release-windows.yml (#190)

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      # #209: `workflow_dispatch` lets the operator pick any ref, and this
      # workflow hands out a byte5 GmbH Developer ID signature, an Apple
      # notarization ticket and a permanent PyPI version. Nothing else in
      # the pipeline ever looked at which ref that was, so a feature branch
      # or a stale commit could be signed and published. First step of all,
      # before even the checkout: it costs nothing and needs nothing.
      - name: Guard — releases are cut from main only
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "main" ] \
            || { echo "dispatched from ${GITHUB_REF_NAME}; releases are cut from main only"; exit 1; }

      # #192: every `uses:` below is pinned to a full commit SHA. This job
      # holds the Developer ID certificate, the notary key, the minisign
      # updater private key and the PyPI token at once, and aiui installs
      # its own updates — so a step resolved from a mutable ref turns one
      # upstream retag into signed, notarized code on every user's machine.
      # `scripts/check-workflow-pins.sh` fails CI if a pin floats again.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Four manifests must agree on the version BEFORE we spend build
      # minutes: Cargo.toml (build), tauri.conf.json (Info.plist),
      # pyproject.toml (PyPI artifact → what `uvx aiui-mcp` resolves on
      # remote hosts), package.json (npm metadata), plus the dispatched
      # version (tag/release) and a CHANGELOG section for it. Drift
      # produced #82 (updater confusion) and the v0.4.2/v0.4.21
      # Tauri-vs-PyPI split on 2026-04-28.
      #
      # The check itself lives in scripts/check-release-preconditions.sh so
      # that CI can run it on every PR (job `release-preconditions`) — drift
      # is then caught in the bump PR rather than at dispatch time — and so
      # the tag probe asks ORIGIN. The inline `git rev-parse "$TAG"` it
      # replaces could never fire: actions/checkout@v4 fetches depth 1 and
      # no tags, so the ref was never present locally (#209).
      - name: Check version sync
        run: |
          set -euo pipefail
          ./scripts/check-release-preconditions.sh "$VERSION"
          # #191: a run that publishes no bridge must not be able to produce
          # a directly-promotable full release. The companion pins
          # `aiui-mcp==${VERSION}`, so without the PyPI artifact every
          # remote's tool calls fail. Skipping the publish is legitimate for
          # a validate-first pre-release; combining it with a full release
          # is not.
          if [ "${{ inputs.publish-pypi }}" != "true" ] \
             && [ "${{ inputs.prerelease }}" != "true" ]; then
            echo "publish-pypi=false requires prerelease=true: a full release"
            echo "without the aiui-mcp ${VERSION} artifact would pin every"
            echo "remote to a version that does not exist."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      # The compiler that builds the signed binary is recorded in
      # `rust-toolchain.toml`, not resolved from the moving `stable` branch.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-11
        with:
          toolchain: "1.98.1"
          targets: aarch64-apple-darwin

      - name: Assert the pinned Rust toolchain
        shell: bash
        working-directory: companion/src-tauri
        run: bash ../../scripts/assert-rust-toolchain.sh

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: companion/src-tauri -> target
          key: release-aarch64-apple-darwin

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          # Exact, not `latest`: this job publishes to PyPI with
          # UV_PUBLISH_TOKEN, so the uv binary is part of the trusted set.
          version: "0.12.17"

      # #209: the release path used to run no tests at all — not cargo test,
      # not pytest, not the drift guards. A commit whose CI was red (or that
      # never had one) could be built, signed, notarized, released and
      # pushed to PyPI with nothing noticing. These are the same checks
      # ci.yml runs; they cost seconds on a runner that is about to spend
      # twenty minutes on a signed build, and they sit BEFORE the keychain
      # import on purpose, so a red test never reaches the signing material.
      - name: Pre-release checks (drift guards)
        run: |
          set -euo pipefail
          ./scripts/check-skill-drift.sh
          ./scripts/test-check-updater-feed.sh
          ./scripts/check-release-ordering.sh
          ./scripts/test-check-release-preconditions.sh

      # test_integration_live.py is opt-in (AIUI_LIVE=1) and skips itself
      # otherwise, so the default selection needs no exclusion here.
      - name: Pre-release checks (Python)
        working-directory: python
        run: uv run --extra dev pytest tests/ -q

      - name: Pre-release checks (Rust)
        working-directory: companion/src-tauri
        run: cargo test --lib --release --target aarch64-apple-darwin

      # Ephemeral keychain + Developer ID import — from the macos-sign.yml
      # template. The keychain password is generated per run and never a
      # secret; the .p12 is removed as soon as it is imported.
      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PW" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/{print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "No 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build frontend
        working-directory: companion
        run: npm ci && npm run build

      # #192: this job's `npx tauri` produces both the signed .app and the
      # minisign-signed updater bundle, so which CLI ran is part of the
      # release record. Assert it is the one package-lock.json locks.
      - name: Assert the locked Tauri CLI
        shell: bash
        working-directory: companion
        run: bash ../scripts/assert-tauri-cli.sh

      # APPLE_SIGNING_IDENTITY is picked up by the Tauri bundler (signs the
      # .app during build); TAURI_SIGNING_PRIVATE_KEY produces the signed
      # updater artifacts (createUpdaterArtifacts: true).
      - name: Tauri build (aarch64, signed + updater artifacts)
        working-directory: companion
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target aarch64-apple-darwin

      # The in-app updater reads CFBundleShortVersionString to decide
      # what's "current" — a drifted bundle reproduces #82 on the next
      # update. Fail here, before notarization spends minutes.
      - name: Verify bundled Info.plist version
        run: |
          set -euo pipefail
          APP="companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/aiui.app"
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [ "$PLIST_VERSION" = "$VERSION" ] \
            || { echo "Info.plist is ${PLIST_VERSION}, expected ${VERSION}"; exit 1; }

      - name: Codesign with entitlements
        run: |
          set -euo pipefail
          APP="companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/aiui.app"
          codesign --force --deep --options runtime \
            --keychain "$SIGN_KEYCHAIN" --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements companion/src-tauri/entitlements.plist \
            "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Write notary API key
        env:
          KEY_B64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Notarize + staple app
        env:
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/aiui.app"
          ZIP="aiui-${VERSION}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          # Re-create the distributable zip AFTER stapling so the ticket
          # ships inside it.
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

      - name: Build, sign, notarize DMG
        env:
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$PWD/aiui-${VERSION}-arm64.dmg"
          rm -f "$DMG"
          (cd companion && npx appdmg src-tauri/dmg/config.json "$DMG")
          codesign --force --keychain "$SIGN_KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait
          xcrun stapler staple "$DMG"

      # Updater bundle is re-created from the STAPLED app, then signed with
      # the minisign key; tauri-updater expects the literal .sig content in
      # latest.json.
      - name: Build updater bundle + latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APP_DIR="companion/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          BUNDLE="$APP_DIR/aiui.app.tar.gz"
          rm -f "$BUNDLE" "$BUNDLE.sig"
          tar -C "$APP_DIR" -czf "$BUNDLE" aiui.app
          (cd companion && npx tauri signer sign "$GITHUB_WORKSPACE/$BUNDLE") >/dev/null
          SIG_JSON="$(python3 -c 'import json,sys;print(json.dumps(open(sys.argv[1]).read()))' "$BUNDLE.sig")"
          cp "$BUNDLE" "aiui-${VERSION}-updater-arm64.tar.gz"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "aiui ${TAG} — see https://github.com/byte5ai/aiui/releases/tag/${TAG}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": ${SIG_JSON},
                "url": "https://github.com/byte5ai/aiui/releases/download/${TAG}/aiui-${VERSION}-updater-arm64.tar.gz"
              }
            }
          }
          JSON

      # Built before tagging/publishing so a packaging regression aborts
      # the release with nothing shipped yet.
      - name: Build Python package
        working-directory: python
        run: |
          set -euo pipefail
          rm -rf dist
          # The published wheel must come from the same resolution CI tested.
          # `uv build` takes no --locked (that flag is only for the resolving
          # commands — run/sync/lock), so verify the lock is current FIRST:
          # `uv lock --check` fails if a dependency edit left uv.lock stale,
          # stopping the release here rather than shipping an unrecorded one
          # (#210) — then build.
          uv lock --check
          uv build
          ls dist/aiui_mcp-${VERSION}-*.whl dist/aiui_mcp-${VERSION}.tar.gz

      # #191: PyPI BEFORE the release, not after.
      #
      # The companion pins the bridge to its own version
      # (`aiui-mcp==<version>`) in every remote's ~/.claude.json. Publishing
      # the app first therefore ships a pin that cannot resolve: on every
      # remote host, `uvx` fails and EVERY aiui tool call returns nothing —
      # for as long as the gap lasts, which is forever if the PyPI step
      # fails and nobody re-runs it.
      #
      # The old ordering was justified by PyPI versions being permanent. The
      # priority is backwards: a published bridge with no matching app is
      # inert (nothing resolves it — the pin only ever names the version the
      # companion was compiled as), while an app with no matching bridge is
      # a dead feature on every remote the user owns.
      - name: Publish aiui-mcp to PyPI
        if: ${{ inputs.publish-pypi }}
        working-directory: python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        # --check-url keeps a same-version recovery re-run working: already
        # uploaded files are skipped instead of failing the run. Without it
        # the reorder would trade one broken recovery path for another.
        run: uv publish --check-url https://pypi.org/simple/aiui-mcp/

      # The index is not instantly consistent, so "upload returned 0" is not
      # yet "a remote can resolve it". Poll until it can.
      #
      # A plain HTTPS index check, deliberately not `uvx aiui-mcp==$VERSION
      # --help`: the package has no --help handler, so the flag is ignored,
      # the MCP server starts, and it blocks on stdin forever — the trap
      # documented in setup.rs.
      - name: Wait for aiui-mcp to be resolvable
        if: ${{ inputs.publish-pypi }}
        run: |
          set -euo pipefail
          URL="https://pypi.org/pypi/aiui-mcp/${VERSION}/json"
          for i in $(seq 1 10); do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || echo 000)"
            if [ "$CODE" = "200" ]; then
              echo "aiui-mcp ${VERSION} is resolvable on PyPI (attempt $i)"
              exit 0
            fi
            echo "attempt $i: PyPI returned $CODE for ${VERSION}, retrying in 6s"
            sleep 6
          done
          echo "aiui-mcp ${VERSION} never appeared on PyPI — refusing to cut a"
          echo "release whose remote pin cannot resolve."
          exit 1

      - name: Tag + GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent: a prior run may have pushed the tag but failed later
          # (e.g. PyPI). Reuse the existing tag instead of aborting on re-run.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already on origin — reusing"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          cat > notes.md <<NOTES_EOF
          ## aiui ${TAG}

          Signed + notarized by byte5 GmbH. From v0.1.2 on, existing installations
          update themselves in place via the in-app updater.

          **Fresh install:** Download \`aiui-${VERSION}-arm64.dmg\`, double-click, drag aiui.app into Applications, launch once.

          (Zip also provided for scripted installs: \`ditto -xk aiui-${VERSION}-arm64.zip /Applications/\`.)

          See the [full diff](https://github.com/byte5ai/aiui/commits/${TAG}).
          NOTES_EOF
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Idempotent: skip creation if the release already exists so a
          # recovery re-run proceeds instead of failing here.
          #
          # #209: creation and upload are SEPARATE. They used to be one
          # `gh release create` with the four assets as arguments, which
          # meant a re-dispatch rebuilt, re-signed and re-notarized
          # everything and then discarded all of it — a green run whose log
          # says "built" while the release keeps the previous run's (or a
          # half-uploaded) asset set. That is the documented recovery path
          # in CONTRIBUTING, so it was the common case, not the exotic one.
          if gh release view "$TAG" --repo byte5ai/aiui >/dev/null 2>&1; then
            echo "release $TAG already exists — reusing it; assets are re-uploaded below"
            # A re-dispatch must NOT un-ship the other platform.
            # release-windows.yml merges its `windows-x86_64` entry into the
            # latest.json this workflow uploaded, so clobbering that file
            # with the freshly built darwin-only feed would send every
            # shipped Windows client's update check into TargetsNotFound —
            # silently, with no error anywhere. So: pull the published feed
            # and splice today's darwin-aarch64 entry INTO it rather than
            # replacing the document. Same tag, same version, so a windows
            # entry carried over still points at this release's installer.
            rm -rf published && mkdir -p published
            if gh release download "$TAG" --repo byte5ai/aiui \
                 --pattern latest.json --dir published >/dev/null 2>&1; then
              python3 -c 'import json,sys; pub=json.load(open(sys.argv[1])); fresh=json.load(open(sys.argv[2])); plat=dict(pub.get("platforms",{})); plat.update(fresh.get("platforms",{})); fresh["platforms"]=plat; json.dump(fresh,open(sys.argv[2],"w"),indent=2); print("latest.json platforms after merge: "+", ".join(sorted(plat)))' \
                published/latest.json latest.json
            else
              echo "no latest.json on $TAG yet — uploading the freshly built feed as is"
            fi
          else
            # DRAFT on purpose (#190). `releases/latest/download/latest.json`
            # is what every installed aiui polls, and a draft is not served
            # there — so clients keep resolving the previous COMPLETE feed
            # while this release is still missing its Windows half. The
            # release-windows run validates the assembled feed and un-drafts
            # it; until then nothing is advertised to anyone.
            #
            # v0.10.1 is why: it published a darwin-only feed immediately, and
            # every Windows client's update check went into the error path
            # until a human remembered to dispatch the second workflow.
            gh release create "$TAG" \
              --repo byte5ai/aiui \
              --title "aiui ${TAG}" \
              --notes-file notes.md \
              --draft \
              $PRERELEASE_FLAG
          fi

          # Unconditional, outside the branch above: what this run actually
          # built is what the release carries. `--clobber` so a partial
          # asset set from a failed run is completed rather than being
          # unrepairable, and deliberately NOT `gh release delete` +
          # recreate — that discards download counts, breaks links already
          # handed out, and drops the Windows assets release-windows.yml
          # attached.
          gh release upload "$TAG" \
            "aiui-${VERSION}-arm64.dmg" \
            "aiui-${VERSION}-arm64.zip" \
            "aiui-${VERSION}-updater-arm64.tar.gz" \
            "latest.json" \
            --repo byte5ai/aiui \
            --clobber

      # #190: the release is a DRAFT until the Windows half lands, so the
      # second workflow is no longer something a human has to remember —
      # forgetting it would now leave the whole release invisible, not just
      # Windows clients broken. Dispatched last, so a failure here does not
      # roll back a good macOS build; the run can be re-dispatched by hand
      # (the workflow is idempotent and `gh release upload --clobber`s).
      - name: Dispatch the Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "dispatching release-windows.yml for $TAG (release is a draft until it completes)"
          gh workflow run release-windows.yml \
            -f tag="$TAG" \
            --repo byte5ai/aiui
          {
            echo "### Release $TAG is a DRAFT"
            echo ""
            echo "\`release-windows.yml\` has been dispatched. It attaches the"
            echo "Windows installer, completes \`latest.json\`, validates the feed"
            echo "and publishes the release."
            echo ""
            echo "If that run fails, the release stays a draft and **no client sees"
            echo "this version** — which is the intended behaviour: a half-published"
            echo "feed breaks update checks on the missing platform."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$SIGN_KEYCHAIN" 2>/dev/null || true
