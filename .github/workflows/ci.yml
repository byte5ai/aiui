name: CI

on:
  push:
    branches: [main]
  # No base-branch filter (#222). `pull_request.branches` matches the BASE,
  # so `[main]` meant a PR stacked on another feature branch got no checks
  # at all — not a failure, not a skip, simply nothing. That is the inverse
  # of what you want: a stacked PR is by construction the one touching code
  # another unmerged change also touches, and a missing check looks like a
  # passing one at a glance.
  #
  # `push` keeps its filter, so a branch push does not trigger a second run
  # alongside the PR event; the concurrency group below collapses
  # superseded runs either way.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Tauri companion (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS arm64
            build_bundle: false
            # Tested in the profile the shipped bundle is built from.
            test_profile: "--release"
            test_rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            build_bundle: true
            # #210: Windows EXECUTES its tests — the platform with the most
            # `#[cfg(windows)]` host-registration branching must run more than
            # the compiler. The `aiui_lib` test binary crashed at *load* with
            # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on this runner (#141);
            # dropping `--release` alone did NOT settle it, so we statically
            # link the CRT (`+crt-static`), the next lever #210 called out — the
            # missing entry point was the dynamically-loaded MSVC runtime. Debug
            # profile is kept (a release test binary is not what ships anyway).
            # `--no-run` stays off the table: it asserts nothing `cargo check`
            # does not. If the crash ever returns, the remaining lever is
            # `-C debuginfo=0`.
            test_profile: ""
            test_rustflags: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      # #192: pinned to a `master` commit, with the compiler version passed
      # explicitly from `rust-toolchain.toml`. `@stable` was a *branch* ref —
      # expected to move — so CI and the release built with whatever compiler
      # happened to be stable that morning, recorded nowhere.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-11
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
          # `--profile minimal` installs no clippy, and a version-named
          # toolchain is not the runner image's pre-provisioned `stable`.
          components: clippy

      - name: Assert the pinned Rust toolchain
        shell: bash
        working-directory: companion/src-tauri
        run: bash ../../scripts/assert-rust-toolchain.sh

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: companion/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        working-directory: companion
        run: npm ci

      # #212: npm audit is the gate — a new *high* advisory against the pinned
      # lockfile turns the PR red; moderates ride dependabot's weekly PRs
      # (.github/dependabot.yml) rather than blocking unrelated work.
      # `--omit=optional` exempts appdmg (an optionalDependency used only by
      # release-macos.yml's DMG build, fed only our own src-tauri/dmg/
      # background.png — no attacker input); npm's "fix" is a downgrade to
      # appdmg@0.1.0 that cannot build the DMG.
      - name: npm audit (production + dev, optional deps exempt)
        working-directory: companion
        run: npm audit --audit-level=high --omit=optional

      # #210: fails on any error and on any warning ABOVE the recorded
      # baseline, so the count can only fall. Lower it in the script when it does.
      - name: Svelte type-check (errors + warning baseline)
        shell: bash
        run: ./scripts/check-svelte-warnings.sh

      # The frontend vitest suite, on every matrix leg (a DOM-free unit half
      # plus a jsdom component half, both platform-independent): the form logic
      # and the settings pane — what the user's answer actually IS (#206/#208) —
      # the TypeScript update path (#197), and hostile-Mermaid sanitisation,
      # which stops a dependency bump from reopening the classDef CSS-injection
      # path or emptying diagrams the way #189 did (#212).
      - name: Frontend tests
        working-directory: companion
        run: npm test

      - name: Vite build
        working-directory: companion
        run: npm run build

      - name: Cargo check
        working-directory: companion/src-tauri
        run: cargo check --release --target ${{ matrix.target }}

      - name: Cargo test
        working-directory: companion/src-tauri
        # `test_rustflags` statically links the CRT on Windows so the test
        # binary loads (#141 / #210); empty elsewhere. Set here, not globally,
        # so `cargo check`/`clippy` keep their own cache.
        env:
          RUSTFLAGS: ${{ matrix.test_rustflags }}
        run: cargo test --lib ${{ matrix.test_profile }} --target ${{ matrix.target }}

      - name: Cargo clippy
        working-directory: companion/src-tauri
        run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

      # #192: the bundler comes from `npm ci` above — the 2.10.1 that
      # `companion/package-lock.json` locks — not from a global install of
      # `@tauri-apps/cli@^2` resolved at build time and thrown away. Two runs
      # of the same commit used to be able to bundle with two different
      # bundlers, and the `.sig` the updater trusts is produced by whichever
      # one npm happened to pick.
      - name: Assert the locked Tauri CLI
        if: matrix.build_bundle
        shell: bash
        working-directory: companion
        run: bash ../scripts/assert-tauri-cli.sh

      # Windows-only: produce a real NSIS installer so we can hand the
      # `.exe` to a tester or run it on a Windows VM. Mac CI stays
      # bundle-less — macOS release bundles are built by release-macos.yml
      # (workflow_dispatch).
      #
      # `tauri.conf.json` has `createUpdaterArtifacts: true` and a
      # minisign pubkey, so Tauri normally expects `TAURI_SIGNING_PRIVATE_KEY`
      # at build time to produce the signed `.nsis.zip` updater bundle.
      # Phase 2a is about validating the cross-compile and producing a
      # runnable installer for manual E2E — the signed-updater path is
      # Phase 4. The override file disables updater artifacts for CI
      # builds; release builds (run manually with secrets present) keep
      # the default tauri.conf.json with updater artifacts on.
      - name: Tauri build (NSIS, no updater bundle)
        if: matrix.build_bundle
        working-directory: companion
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload NSIS installer
        if: matrix.build_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiui-windows-x86_64-nsis
          path: companion/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  skill-drift:
    name: skill.md drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # docs/skill.md (canonical, embedded in the Rust MCP server) and
      # python/src/aiui_mcp/skill.md (shipped with the Python bridge) must
      # document the same field/tool surface — both bridges expose the same
      # MCP tools. The two copies are deliberately tailored per bridge, so
      # this is never a byte diff. Three assertions (#205): matching
      # field/tool *sections* (backticked header tokens), every kind in
      # `KNOWN_FIELD_KINDS` (parsed out of http.rs) documented as a
      # backticked token in both copies, and tool-name parity between
      # `tools_list()` in mcp.rs and the `@mcp.tool()` set in server.py.
      # The section check alone stayed green while `tree` shipped
      # undocumented in both copies. See the script header for how to
      # allowlist a deliberate divergence; the guard's own negative tests
      # live in python/tests/test_skill_contract.py (job `mcp`).
      - name: Check skill.md copies are in sync
        run: ./scripts/check-skill-drift.sh

      # #190: the updater-feed guard is what stops a half-published
      # `latest.json` from reaching users — a feed missing a platform sends
      # that platform's update check into TargetsNotFound rather than
      # "up to date". A guard that silently stopped guarding would be worse
      # than none, so it is exercised against fixtures on every PR, including
      # the exact shape that shipped in v0.10.1.
      - name: Self-test the updater-feed guard
        run: ./scripts/test-check-updater-feed.sh

      # #191: the release step order — PyPI publish → resolve check → GitHub
      # release — must not be quietly reversed by a later edit. The companion
      # pins aiui-mcp==<version> on every remote, so an app cut before its
      # bridge exists on PyPI leaves every remote's tool calls unresolvable.
      # This textual guard fails the PR that would reintroduce that ordering.
      - name: Guard the release step order
        run: ./scripts/check-release-ordering.sh

      # #207: the `target` file-write approval line — the only disclosure of
      # an arbitrary file write, and the thing the submit button approves —
      # shipped as hardcoded German, unreadable to anyone outside `de`. This
      # guard fails a PR that leaves a German literal in a component or that
      # adds a key to one catalog but not the other.
      - name: Check i18n catalog parity and hardcoded German
        run: ./scripts/check-i18n-parity.sh

  workflow-pins:
    name: Workflow pin guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # #192: the release jobs hold the Developer ID certificate, the notary
      # key, the minisign updater key and the PyPI token in one environment,
      # and aiui installs its own updates — so a third-party action resolved
      # from a mutable ref is a direct path from an upstream takeover to
      # signed code on every user's machine. Every `uses:` is a commit SHA;
      # this job is what stops the next edit from floating one again.
      - name: Check workflow refs are pinned by SHA
        run: ./scripts/check-workflow-pins.sh

      - name: Self-test the workflow pin guard
        run: ./scripts/test-check-workflow-pins.sh

  release-preconditions:
    name: release preconditions
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned like every other `uses:` so the workflow-pin guard above
      # stays green (#192).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # #209: the four version-carrying manifests (Cargo.toml,
      # tauri.conf.json, pyproject.toml, package.json) must agree, and
      # CHANGELOG.md must have a section for the version they carry. The
      # same script gates the release dispatch; running it here, in
      # no-argument mode, means drift is caught in the bump PR rather than
      # twenty signed minutes into a release run. `companion/package.json`
      # had drifted six minor versions (0.4.5 against 0.10.1) precisely
      # because nothing on either path looked at it.
      - name: Check the release preconditions
        run: ./scripts/check-release-preconditions.sh

      # A guard that silently stopped guarding would be worse than none.
      - name: Self-test the release-preconditions guard
        run: ./scripts/test-check-release-preconditions.sh

  mcp:
    name: aiui-mcp (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Every step below is a bash script (the smoke-check pipes `printf` into
    # `timeout`), so the Windows leg runs Git Bash rather than pwsh — one
    # script, three runners (#210).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared `requires-python` floor, actually exercised.
          - os: ubuntu-latest
            python: "3.10"
            label: Linux · py3.10
          # The everyday leg: also the one that lints and builds the wheel,
          # because both are platform-independent and need running once.
          - os: ubuntu-latest
            python: "3.12"
            label: Linux · py3.12
            lint: true
            package: true
          - os: ubuntu-latest
            python: "3.14"
            label: Linux · py3.14
          # The bottom of `mcp>=1.26.0,<2` — proven rather than assumed. The
          # weekly `deps-refresh.yml` covers the other end by re-resolving
          # without the lock, so both edges of the range are watched.
          - os: ubuntu-latest
            python: "3.10"
            label: Linux · py3.10 · lowest-direct
            resolution: lowest-direct
          # macOS and Windows run the bridge's own platform branches — above
          # all `_default_token_path`, which decides where the auth token is
          # read from and used to be executed on Linux only.
          - os: macos-14
            python: "3.12"
            label: macOS · py3.12
          - os: windows-latest
            python: "3.12"
            label: Windows · py3.12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          # #192: exact, not `latest` — `latest` downloaded whatever uv
          # shipped that morning into the same job shape that holds
          # UV_PUBLISH_TOKEN on the release path.
          version: "0.12.17"

      # `--locked` is the point: without it every run re-resolved
      # `mcp>=1.26.0,<2` from scratch, so CI and a user's `uvx aiui-mcp`
      # could be running different FastMCP versions and nobody would know.
      # It also fails loudly on a `pyproject.toml` dependency edit that
      # forgot `uv lock`.
      - name: Run unit tests
        if: ${{ !matrix.resolution }}
        working-directory: python
        run: uv run --locked --python ${{ matrix.python }} --extra dev pytest tests/ -v

      - name: Run unit tests (lowest declared versions)
        if: matrix.resolution
        working-directory: python
        run: >
          uv run --resolution ${{ matrix.resolution }}
          --python ${{ matrix.python }} --extra dev pytest tests/ -v

      # The `# noqa` codes in `server.py` and the tests (BLE001, A001, N802)
      # named rules nothing enforced until this step existed.
      - name: Ruff lint + format check
        if: matrix.lint
        working-directory: python
        run: |
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

      - name: Build wheel + sdist
        if: matrix.package
        working-directory: python
        # `uv build` packages the source; it takes no `--locked` (that flag is
        # for the resolving commands — run/sync/lock — which the steps above use).
        run: uv build

      # Linux only: this checks the packaging, not the platform — and
      # `uv tool install` puts the entry point on a PATH only the POSIX
      # runners export into the step's shell.
      - name: Install wheel and smoke-check entry point
        if: matrix.package
        working-directory: python
        run: |
          uv tool install --force ./dist/aiui_mcp-*.whl
          which aiui-mcp
          # initialize handshake — timeout after 2s
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 1) \
            | timeout 5 aiui-mcp | head -2
          # MCP 2026-07-28 stdio backward-compat probe: modern clients send
          # server/discover FIRST and fall back to initialize on any
          # non-modern JSON-RPC error. The wheel must answer that probe
          # deterministically with an error response (FastMCP: -32602) —
          # silence or a hang would make modern clients treat aiui as dead
          # instead of falling back to the legacy handshake.
          (printf '%s\n' '{"jsonrpc":"2.0","id":9,"method":"server/discover","params":{}}'; sleep 1) \
            | timeout 5 aiui-mcp | grep -q '"error"'
