name: CI

on:
  push:
    branches: [main]
  # No base-branch filter (#222). `pull_request.branches` matches the BASE,
  # so `[main]` meant a PR stacked on another feature branch got no checks
  # at all — not a failure, not a skip, simply nothing. That is the inverse
  # of what you want: a stacked PR is by construction the one touching code
  # another unmerged change also touches, and a missing check looks like a
  # passing one at a glance.
  #
  # `push` keeps its filter, so a branch push does not trigger a second run
  # alongside the PR event; the concurrency group below collapses
  # superseded runs either way.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Tauri companion (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macOS arm64
            build_bundle: false
            run_tests: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows x86_64
            build_bundle: true
            # #183: Windows executes the test binary again. It used to be
            # compiled with `--no-run` and thrown away, because the freshly
            # linked `aiui_lib` test binary crashed at *load* with
            # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on the runner (#141,
            # closed as completed 2026-08-01) — a loader artifact, not a
            # logic failure. The skip's justification ("aiui ships macOS-only
            # and the Windows port is WIP") stopped being true at v0.10.1,
            # and Windows is now the platform where the host-registration
            # code has the most per-OS branching and the least history. A
            # matrix entry that never runs a test is a green check that
            # asserts nothing. If the loader crash returns, reopen #141 with
            # the failing run linked rather than silently flipping this back.
            run_tests: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      # #192: pinned to a `master` commit, with the compiler version passed
      # explicitly from `rust-toolchain.toml`. `@stable` was a *branch* ref —
      # expected to move — so CI and the release built with whatever compiler
      # happened to be stable that morning, recorded nowhere.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-11
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
          # `--profile minimal` installs no clippy, and a version-named
          # toolchain is not the runner image's pre-provisioned `stable`.
          components: clippy

      - name: Assert the pinned Rust toolchain
        shell: bash
        working-directory: companion/src-tauri
        run: bash ../../scripts/assert-rust-toolchain.sh

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: companion/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        working-directory: companion
        run: npm ci

      - name: Svelte type-check
        working-directory: companion
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error

      # #206: the frontend's form logic — what the user's answer actually IS —
      # used to be covered by nothing but the type-check above. Runs on every
      # matrix leg; the unit half is DOM-free, the component half uses jsdom,
      # so both are platform-independent.
      - name: Frontend tests
        working-directory: companion
        run: npm test

      - name: Vite build
        working-directory: companion
        run: npm run build

      # #197: the frontend had no test runner at all, so the update path —
      # entirely TypeScript, and the one path whose failures are invisible
      # by construction — had zero coverage. `vitest` runs on both matrix
      # legs: the suite is pure logic over mocked Tauri plugins, so unlike
      # the Rust test binary it has no Windows loader problem.
      - name: Frontend unit tests
        working-directory: companion
        run: npm run test

      - name: Cargo check
        working-directory: companion/src-tauri
        run: cargo check --release --target ${{ matrix.target }}

      - name: Cargo test (run)
        if: matrix.run_tests
        working-directory: companion/src-tauri
        run: cargo test --lib --release --target ${{ matrix.target }}

      - name: Cargo clippy
        working-directory: companion/src-tauri
        run: cargo clippy --release --target ${{ matrix.target }} -- -D warnings

      # #192: the bundler comes from `npm ci` above — the 2.10.1 that
      # `companion/package-lock.json` locks — not from a global install of
      # `@tauri-apps/cli@^2` resolved at build time and thrown away. Two runs
      # of the same commit used to be able to bundle with two different
      # bundlers, and the `.sig` the updater trusts is produced by whichever
      # one npm happened to pick.
      - name: Assert the locked Tauri CLI
        if: matrix.build_bundle
        shell: bash
        working-directory: companion
        run: bash ../scripts/assert-tauri-cli.sh

      # Windows-only: produce a real NSIS installer so we can hand the
      # `.exe` to a tester or run it on a Windows VM. Mac CI stays
      # bundle-less — macOS release bundles are built by release-macos.yml
      # (workflow_dispatch).
      #
      # `tauri.conf.json` has `createUpdaterArtifacts: true` and a
      # minisign pubkey, so Tauri normally expects `TAURI_SIGNING_PRIVATE_KEY`
      # at build time to produce the signed `.nsis.zip` updater bundle.
      # Phase 2a is about validating the cross-compile and producing a
      # runnable installer for manual E2E — the signed-updater path is
      # Phase 4. The override file disables updater artifacts for CI
      # builds; release builds (run manually with secrets present) keep
      # the default tauri.conf.json with updater artifacts on.
      - name: Tauri build (NSIS, no updater bundle)
        if: matrix.build_bundle
        working-directory: companion
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload NSIS installer
        if: matrix.build_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aiui-windows-x86_64-nsis
          path: companion/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  skill-drift:
    name: skill.md drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # docs/skill.md (canonical, embedded in the Rust MCP server) and
      # python/src/aiui_mcp/skill.md (shipped with the Python bridge) must
      # document the same field/tool surface — both bridges expose the same
      # MCP tools. The two copies are deliberately tailored per bridge, so
      # this is never a byte diff. Three assertions (#205): matching
      # field/tool *sections* (backticked header tokens), every kind in
      # `KNOWN_FIELD_KINDS` (parsed out of http.rs) documented as a
      # backticked token in both copies, and tool-name parity between
      # `tools_list()` in mcp.rs and the `@mcp.tool()` set in server.py.
      # The section check alone stayed green while `tree` shipped
      # undocumented in both copies. See the script header for how to
      # allowlist a deliberate divergence; the guard's own negative tests
      # live in python/tests/test_skill_contract.py (job `mcp`).
      - name: Check skill.md copies are in sync
        run: ./scripts/check-skill-drift.sh

      # #190: the updater-feed guard is what stops a half-published
      # `latest.json` from reaching users — a feed missing a platform sends
      # that platform's update check into TargetsNotFound rather than
      # "up to date". A guard that silently stopped guarding would be worse
      # than none, so it is exercised against fixtures on every PR, including
      # the exact shape that shipped in v0.10.1.
      - name: Self-test the updater-feed guard
        run: ./scripts/test-check-updater-feed.sh

      # #191: the release step order — PyPI publish → resolve check → GitHub
      # release — must not be quietly reversed by a later edit. The companion
      # pins aiui-mcp==<version> on every remote, so an app cut before its
      # bridge exists on PyPI leaves every remote's tool calls unresolvable.
      # This textual guard fails the PR that would reintroduce that ordering.
      - name: Guard the release step order
        run: ./scripts/check-release-ordering.sh

  workflow-pins:
    name: Workflow pin guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # #192: the release jobs hold the Developer ID certificate, the notary
      # key, the minisign updater key and the PyPI token in one environment,
      # and aiui installs its own updates — so a third-party action resolved
      # from a mutable ref is a direct path from an upstream takeover to
      # signed code on every user's machine. Every `uses:` is a commit SHA;
      # this job is what stops the next edit from floating one again.
      - name: Check workflow refs are pinned by SHA
        run: ./scripts/check-workflow-pins.sh

      - name: Self-test the workflow pin guard
        run: ./scripts/test-check-workflow-pins.sh

  mcp:
    name: aiui-mcp (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          # #192: exact, not `latest` — `latest` downloaded whatever uv
          # shipped that morning into the same job shape that holds
          # UV_PUBLISH_TOKEN on the release path.
          version: "0.12.17"

      - name: Run unit tests
        working-directory: python
        run: uv run --extra dev pytest tests/ -v

      - name: Build wheel + sdist
        working-directory: python
        run: uv build

      - name: Install wheel and smoke-check entry point
        working-directory: python
        run: |
          uv tool install --force ./dist/aiui_mcp-*.whl
          which aiui-mcp
          # initialize handshake — timeout after 2s
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'; sleep 1) \
            | timeout 5 aiui-mcp | head -2
          # MCP 2026-07-28 stdio backward-compat probe: modern clients send
          # server/discover FIRST and fall back to initialize on any
          # non-modern JSON-RPC error. The wheel must answer that probe
          # deterministically with an error response (FastMCP: -32602) —
          # silence or a hang would make modern clients treat aiui as dead
          # instead of falling back to the legacy handshake.
          (printf '%s\n' '{"jsonrpc":"2.0","id":9,"method":"server/discover","params":{}}'; sleep 1) \
            | timeout 5 aiui-mcp | grep -q '"error"'
