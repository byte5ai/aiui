# Windows release pipeline for aiui — companion side only.
#
# Why a separate workflow: macOS releases run through
# `release-macos.yml` (workflow_dispatch; Developer ID + notarytool via
# App Store Connect API key, all in CI). Windows artifacts are attached
# in a second step because the Windows port is WIP and not every release
# ships one.
#
# This workflow runs against a tag/release that `release-macos.yml`
# already created. Since #190 that release is created as a **draft** and
# this workflow is **dispatched automatically** by it — `workflow_dispatch`
# is kept so a failed run can be repeated by hand.
#
# What this workflow does: attach the Windows installer + updater bundle to
# the release, add the `windows-x86_64` entry to `latest.json`, validate
# the assembled feed (`scripts/check-updater-feed.sh`), and only then
# un-draft the release.
#
# Why the draft matters: `releases/latest/download/latest.json` is what
# every installed aiui polls, and a feed missing a platform sends that
# platform's update check into `TargetsNotFound` — an error, not an
# "up to date". v0.10.1 published a darwin-only feed immediately and broke
# every Windows client's update check until this workflow was remembered.
# A draft is not served there, so clients keep resolving the previous
# complete feed until this run finishes.
#
# Prerequisites:
#
#   1. Repo → Settings → Secrets and variables → Actions:
#        - TAURI_SIGNING_PRIVATE_KEY        (literal content of the
#                                            minisign private key — not
#                                            a path)
#        - TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                                           (empty string if the key has
#                                            no password)
#      Both are shared with `release-macos.yml` and already configured.
#
#   2. The release for `vX.Y.Z` must already exist on GitHub — created by
#      `release-macos.yml`, which is the only path that cuts a release.
#      aiui is never built or released locally; `scripts/release.sh` is a
#      stub that refuses to run. See CONTRIBUTING.md → "Releasing".
#
# Usage:
#
#   gh workflow run release-windows.yml -f tag=v0.5.0 --repo byte5ai/aiui
#   # or: GitHub UI → Actions → "release-windows" → Run workflow
#
# What the run produces:
#
#   - aiui_<version>_x64-setup.exe                attached to release
#   - aiui_<version>_x64-setup.exe.sig            attached to release
#   - latest.json patched in-place with the new windows-x86_64 entry
#
# Code signing for the `.exe` itself (Authenticode / SmartScreen) is
# explicitly NOT done here — the v1 plan calls for unsigned shipping with
# the SmartScreen nag accepted (Phase 4 of the port plan in PR #118).
# Adding an EV cert later is a separate concern that touches the
# `tauri build` invocation only; the rest of this workflow stays unchanged.
#
# Note on coverage: the installer produced here differs from the one CI
# uploads per-push. CI builds with `tauri.ci.conf.json`
# (`createUpdaterArtifacts: false`), so it yields the `.exe` only — the
# signed installer + `.sig` that the updater feed needs are produced
# *only* by this workflow. Beta feedback on a CI artifact therefore says
# nothing about the update path.

name: release-windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0). Must already exist on GitHub."
        required: true
        type: string

permissions:
  contents: write   # needed for `gh release upload` + the latest.json edit

concurrency:
  group: release-windows-${{ inputs.tag }}
  cancel-in-progress: false   # never cancel a release midway

jobs:
  build-and-attach:
    name: Build signed Windows installer + attach to release
    runs-on: windows-latest
    steps:
      # #192: every `uses:` below is pinned to a full commit SHA. This job
      # holds the minisign updater private key, and aiui installs its own
      # updates — a step resolved from a mutable ref would turn an upstream
      # retag into a signed installer every Windows client accepts.
      # `scripts/check-workflow-pins.sh` fails CI if a pin floats again.
      - name: Checkout the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      # The compiler is recorded in `rust-toolchain.toml`, not resolved from
      # the moving `stable` branch at dispatch time.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-11
        with:
          toolchain: "1.98.1"
          targets: x86_64-pc-windows-msvc

      - name: Assert the pinned Rust toolchain
        shell: bash
        working-directory: companion/src-tauri
        run: bash ../../scripts/assert-rust-toolchain.sh

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: companion/src-tauri -> target
          key: x86_64-pc-windows-msvc-release

      - name: Install frontend deps
        working-directory: companion
        run: npm ci

      - name: Vite build
        working-directory: companion
        run: npm run build

      # #192: no global `@tauri-apps/cli@^2` install any more. That resolved
      # a bundler at release time, discarded it, and recorded nothing — so
      # the `.exe` a user runs and the `.sig` the updater verifies came from
      # a version nobody could name afterwards, while `npm ci` two steps up
      # had already installed the 2.10.1 the lockfile pins. `npx` below picks
      # that one up, which is what the macOS job has always done.
      - name: Assert the locked Tauri CLI
        shell: bash
        working-directory: companion
        run: bash ../scripts/assert-tauri-cli.sh

      # Use the production tauri.conf.json — `createUpdaterArtifacts:
      # true` is correct here, the secrets are present, the produced
      # signed installer + `.sig` go into the release.
      - name: Tauri build (NSIS + updater bundle)
        working-directory: companion
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Locate produced bundle files
        id: bundle
        shell: pwsh
        working-directory: companion/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
        # Tauri signs the NSIS installer IN PLACE: the updater artifact is
        # `<name>-setup.exe` itself, with `<name>-setup.exe.sig` beside it.
        # There is no `.nsis.zip` intermediate — the first real run of this
        # workflow (v0.10.1) proved that by failing here while the build
        # log listed exactly those two files. The old lookup's error text
        # ("check TAURI_SIGNING_PRIVATE_KEY") was doubly misleading: the
        # key had worked, which is precisely why the .sig existed.
        run: |
          $exe = Get-ChildItem -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer produced" }
          $sig = Get-ChildItem -Filter "$($exe.Name).sig" | Select-Object -First 1
          if (-not $sig) {
            throw "installer $($exe.Name) has no .sig — updater signing did not run; check TAURI_SIGNING_PRIVATE_KEY"
          }
          "exe=$($exe.FullName)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sig=$($sig.FullName)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer=$($exe.Name)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$($exe.BaseName -replace '^aiui_' -replace '_x64-setup$','')" `
                                      | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Attach installer + signature to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" `
            "${{ steps.bundle.outputs.exe }}" `
            "${{ steps.bundle.outputs.sig }}" `
            --repo "${{ github.repository }}" `
            --clobber

      # Patch the existing latest.json to add the windows-x86_64 entry,
      # then upload it back to the release (overwriting the macOS-only
      # version that release-macos.yml produced earlier).
      - name: Update latest.json with windows-x86_64 entry
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.bundle.outputs.version }}
          SIG_PATH: ${{ steps.bundle.outputs.sig }}
          INSTALLER: ${{ steps.bundle.outputs.installer }}
        run: |
          # Pull the current latest.json from the release.
          gh release download "$env:TAG" --repo "$env:REPO" --pattern "latest.json" --output latest.json --clobber

          # The updater downloads and runs the installer directly, so the
          # url points at the .exe — the same artifact the .sig signs.
          # Built from the actual produced filename rather than re-derived
          # from VERSION, so a naming change can't silently desync the two.
          $sig = Get-Content -Raw -Path "$env:SIG_PATH"
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/$env:INSTALLER"

          $json = Get-Content -Raw -Path latest.json | ConvertFrom-Json
          if (-not $json.platforms) { $json | Add-Member -NotePropertyName platforms -NotePropertyValue (New-Object PSObject) }
          $json.platforms | Add-Member -Force -NotePropertyName "windows-x86_64" -NotePropertyValue ([PSCustomObject]@{
            signature = $sig
            url       = $url
          })
          $json | ConvertTo-Json -Depth 10 | Set-Content -Path latest.json -NoNewline

          gh release upload "$env:TAG" latest.json --repo "$env:REPO" --clobber

      # #190: the feed is what every installed aiui polls. Validate it before
      # the release becomes visible — a run that fails here leaves a draft
      # nobody is served, which is strictly better than publishing a feed that
      # sends one platform's update check into the error path.
      - name: Validate the updater feed
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: ./scripts/check-updater-feed.sh latest.json "$TAG" "$VERSION"

      # Only now is the release served by `releases/latest/download/…`.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --repo "$REPO"
            echo "published $TAG — the feed now carries both platforms"
          else
            echo "$TAG is already published — nothing to un-draft"
          fi

      - name: Verification summary
        run: |
          echo "Windows release for ${{ inputs.tag }} attached." >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "Artifacts:" >> $env:GITHUB_STEP_SUMMARY
          echo "- ${{ steps.bundle.outputs.installer }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- ${{ steps.bundle.outputs.installer }}.sig" >> $env:GITHUB_STEP_SUMMARY
          echo "- latest.json (patched with windows-x86_64)" >> $env:GITHUB_STEP_SUMMARY
